<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>西语闯关小队</title>
  <style>
    :root {
      --bg: #0f172a;
      --panel: #111827;
      --card: #1f2937;
      --accent: #f59e0b;
      --good: #22c55e;
      --bad: #ef4444;
      --text: #f8fafc;
      --muted: #cbd5e1;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
      background: radial-gradient(circle at top, #1e293b, var(--bg));
      color: var(--text);
      display: grid;
      place-items: center;
      padding: 16px;
    }
    .app {
      width: min(900px, 100%);
      background: color-mix(in oklab, var(--panel), black 15%);
      border: 1px solid #334155;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 20px 40px rgba(0,0,0,0.45);
    }
    header {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: center;
      padding: 20px;
      background: linear-gradient(90deg, #7c2d12, #ea580c);
    }
    h1 { margin: 0; font-size: clamp(1.2rem, 3vw, 1.8rem); }
    .stats {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      font-weight: 700;
      font-size: 0.95rem;
    }
    .pill {
      background: rgba(0,0,0,0.28);
      border: 1px solid rgba(255,255,255,0.35);
      padding: 6px 10px;
      border-radius: 999px;
    }
    main { padding: 18px; display: grid; gap: 16px; }
    .card {
      background: var(--card);
      border: 1px solid #374151;
      border-radius: 16px;
      padding: 16px;
    }
    .q-label { color: var(--muted); margin-bottom: 8px; font-size: 0.95rem; }
    .question { font-size: clamp(1.2rem, 3vw, 1.8rem); margin: 6px 0 10px; }
    .choices { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px,1fr)); gap: 10px; }
    button {
      border: none;
      border-radius: 12px;
      padding: 12px;
      font-size: 1rem;
      cursor: pointer;
      transition: transform .15s ease, opacity .15s ease;
    }
    button:hover { transform: translateY(-1px); }
    button:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
    .choice { background: #334155; color: var(--text); border: 1px solid transparent; }
    .choice.correct { background: color-mix(in oklab, var(--good), #0f172a 35%); border-color: #4ade80; }
    .choice.wrong { background: color-mix(in oklab, var(--bad), #0f172a 35%); border-color: #f87171; }
    .control { display: flex; flex-wrap: wrap; gap: 10px; }
    .primary { background: var(--accent); color: #111827; font-weight: 800; }
    .secondary { background: #475569; color: white; }
    .input-row { display: flex; gap: 8px; flex-wrap: wrap; }
    input[type="text"] {
      flex: 1;
      min-width: 180px;
      border: 1px solid #64748b;
      background: #0f172a;
      color: white;
      padding: 12px;
      border-radius: 12px;
      font-size: 1rem;
    }
    .feedback { min-height: 24px; font-weight: 700; }
    .good { color: #86efac; }
    .bad { color: #fca5a5; }
    .tips { color: var(--muted); line-height: 1.6; }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <h1>🎮 西语闯关小队</h1>
      <div class="stats">
        <span class="pill">关卡: <span id="round">1</span>/<span id="total">0</span></span>
        <span class="pill">得分: <span id="score">0</span></span>
        <span class="pill">连击: <span id="streak">0</span></span>
      </div>
    </header>

    <main>
      <section class="card">
        <div class="q-label" id="modeLabel">模式：选择中文释义</div>
        <div class="question" id="question">加载中...</div>

        <div id="mcArea">
          <div class="choices" id="choices"></div>
        </div>

        <div id="spellArea" style="display:none">
          <div class="input-row">
            <input id="spellInput" type="text" placeholder="输入西语单词，例如: hola" />
            <button id="submitSpell" class="primary">提交</button>
          </div>
        </div>

        <div class="feedback" id="feedback"></div>
      </section>

      <section class="card control">
        <button id="nextBtn" class="primary" disabled>下一题</button>
        <button id="switchBtn" class="secondary">切换模式</button>
        <button id="resetBtn" class="secondary">重新开始</button>
      </section>

      <section class="card tips">
        <strong>玩法：</strong>
        <ul>
          <li>模式A：看西语，选中文。</li>
          <li>模式B：看中文，拼写西语。</li>
          <li>答对加10分，连击越高越有成就感。</li>
        </ul>
      </section>
    </main>
  </div>

  <script>
    const words = [
      { es: 'hola', zh: '你好' },
      { es: 'gracias', zh: '谢谢' },
      { es: 'adiós', zh: '再见' },
      { es: 'agua', zh: '水' },
      { es: 'comida', zh: '食物' },
      { es: 'escuela', zh: '学校' },
      { es: 'amigo', zh: '朋友' },
      { es: 'familia', zh: '家庭' },
      { es: 'libro', zh: '书' },
      { es: 'casa', zh: '房子' }
    ];

    let pool = [];
    let current;
    let mode = 'mc';
    let score = 0;
    let streak = 0;
    let round = 1;

    const el = {
      total: document.getElementById('total'),
      round: document.getElementById('round'),
      score: document.getElementById('score'),
      streak: document.getElementById('streak'),
      modeLabel: document.getElementById('modeLabel'),
      question: document.getElementById('question'),
      choices: document.getElementById('choices'),
      feedback: document.getElementById('feedback'),
      nextBtn: document.getElementById('nextBtn'),
      switchBtn: document.getElementById('switchBtn'),
      resetBtn: document.getElementById('resetBtn'),
      mcArea: document.getElementById('mcArea'),
      spellArea: document.getElementById('spellArea'),
      spellInput: document.getElementById('spellInput'),
      submitSpell: document.getElementById('submitSpell')
    };

    function shuffle(arr) {
      return arr.slice().sort(() => Math.random() - 0.5);
    }

    function updateStats() {
      el.total.textContent = words.length;
      el.round.textContent = round;
      el.score.textContent = score;
      el.streak.textContent = streak;
    }

    function nextQuestion() {
      if (round > words.length) {
        el.question.textContent = `挑战完成！你的总分是 ${score}`;
        el.modeLabel.textContent = '结算';
        el.choices.innerHTML = '';
        el.mcArea.style.display = 'none';
        el.spellArea.style.display = 'none';
        el.feedback.textContent = '点击“重新开始”再来一轮！';
        el.feedback.className = 'feedback good';
        el.nextBtn.disabled = true;
        return;
      }

      current = pool[round - 1];
      el.nextBtn.disabled = true;
      el.feedback.textContent = '';
      el.feedback.className = 'feedback';

      if (mode === 'mc') {
        el.modeLabel.textContent = '模式：选择中文释义';
        el.question.textContent = `“${current.es}” 的中文意思是？`;
        el.mcArea.style.display = 'block';
        el.spellArea.style.display = 'none';
        renderChoices();
      } else {
        el.modeLabel.textContent = '模式：拼写西语单词';
        el.question.textContent = `请写出“${current.zh}”的西语：`;
        el.mcArea.style.display = 'none';
        el.spellArea.style.display = 'block';
        el.spellInput.value = '';
        el.spellInput.focus();
      }
      updateStats();
    }

    function renderChoices() {
      const wrongs = shuffle(words.filter(w => w.es !== current.es)).slice(0, 3).map(w => w.zh);
      const options = shuffle([current.zh, ...wrongs]);
      el.choices.innerHTML = '';
      options.forEach(opt => {
        const btn = document.createElement('button');
        btn.className = 'choice';
        btn.textContent = opt;
        btn.onclick = () => checkMC(btn, opt);
        el.choices.appendChild(btn);
      });
    }

    function markResult(ok, message) {
      if (ok) {
        score += 10;
        streak += 1;
        el.feedback.className = 'feedback good';
      } else {
        streak = 0;
        el.feedback.className = 'feedback bad';
      }
      el.feedback.textContent = message;
      el.nextBtn.disabled = false;
      updateStats();
    }

    function checkMC(btn, answer) {
      const buttons = [...el.choices.querySelectorAll('button')];
      buttons.forEach(b => (b.disabled = true));

      if (answer === current.zh) {
        btn.classList.add('correct');
        markResult(true, '答对了！');
      } else {
        btn.classList.add('wrong');
        const correct = buttons.find(b => b.textContent === current.zh);
        if (correct) correct.classList.add('correct');
        markResult(false, `答错了，正确答案是：${current.zh}`);
      }
    }

    function normalize(s) {
      return s.trim().toLowerCase();
    }

    function checkSpell() {
      const answer = normalize(el.spellInput.value);
      if (!answer) return;
      const expected = normalize(current.es);
      if (answer === expected) {
        markResult(true, '拼写正确！');
      } else {
        markResult(false, `不对哦，正确拼写是：${current.es}`);
      }
      el.submitSpell.disabled = true;
      setTimeout(() => (el.submitSpell.disabled = false), 300);
    }

    function resetGame() {
      pool = shuffle(words);
      score = 0;
      streak = 0;
      round = 1;
      updateStats();
      nextQuestion();
    }

    el.nextBtn.onclick = () => {
      round += 1;
      nextQuestion();
    };
    el.switchBtn.onclick = () => {
      mode = mode === 'mc' ? 'spell' : 'mc';
      resetGame();
    };
    el.resetBtn.onclick = resetGame;
    el.submitSpell.onclick = checkSpell;
    el.spellInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') checkSpell();
    });

    resetGame();
  </script>
</body>
</html>
